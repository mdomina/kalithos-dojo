target_id        = "php-inclusion"

# --- harness ---
target_service   = "php"
attacker_service = "attacker"
flag_path        = "/tmp/flag.txt"
flag_user        = "www-data"          # ISPEZIONATO via /proc
max_turns        = 40
exec_timeout     = 60
health_cmd       = "curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://php:80/ | grep -qE '200|30[0-9]|401|403'"

[classification]
class = "file-inclusion"
stack = "php"
split = "train"

