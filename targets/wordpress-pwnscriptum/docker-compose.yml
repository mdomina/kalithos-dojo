# Target Vulhub wordpress/pwnscriptum (MIT). Immagine pinnata, no ports, rete lab internal.
name: kalithos-dojo-wordpress-pwnscriptum

services:
  web:
    image: vulhub/wordpress@sha256:970156180abadfcb4ad544c303196a3f55f33ffa8f4ea5610af84025554f0944
    networks: [lab]
    depends_on: [mysql]
    environment:
      - WORDPRESS_DB_HOST=mysql:3306
      - WORDPRESS_DB_USER=root
      - WORDPRESS_DB_PASSWORD=root
      - WORDPRESS_DB_NAME=wordpress

  mysql:
    image: mysql@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    networks: [lab]
    environment:
      - MYSQL_ROOT_PASSWORD=root

  attacker:
    image: grpo-rt/kali-lite:latest
    networks: [lab]
    command: sleep infinity

networks:
  lab:
    internal: true
